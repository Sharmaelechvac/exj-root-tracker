name: Decode underground photos

on:
  push:
    branches: [ug-photos-staging]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ug-photos-staging
        uses: actions/checkout@v4
        with:
          ref: ug-photos-staging

      - name: Decode, verify, and clean staging files
        run: |
          set -euo pipefail
          mkdir -p seed-photos

          expected_14065=e25bd7b4f7a0ad333d8ddd059129417ad09ddf82b47f5576a0c62da653ec2b66
          expected_15133=efc7c558d67c25af8ee50553625aaf1a6d7f219382a2ba03b63404ac98bed30d
          expected_16321=0017dc1ec72fa9ee4e9ac6ff8beb194db02fe26872a1aa0ab8241430743d77cd
          expected_17385=a8b2bf548953f13dbd2d915523ee0ac6b6f0dc85dbed9184a0c5d81d4f36f7bb
          expected_212=b5b94489ed688277a1c920f2da3076981204abe143625868f799f96e1cd462c9
          expected_498=6dbeca6e42c60011c69004a509b2d1eb310eb5379533decdfc63b5baedbe4999
          expected_601=32bee48f5e7b198fa71bf17608ea67c86414ab364b4bb0ff68293c76cbd45c79

          shopt -s nullglob
          files=(_staging/seed-photos/*.jpg.b64)
          if [ "${#files[@]}" -ne 7 ]; then
            echo "Expected 7 .b64 files, found ${#files[@]}"
            printf ' %s\n' "${files[@]}"
            exit 1
          fi

          for src in "${files[@]}"; do
            base="$(basename "$src" .b64)"
            dest="seed-photos/${base}"
            base64 -d "$src" > "$dest"
            actual="$(sha256sum "$dest" | awk '{print $1}')"
            case "$base" in
              14065-underground-electrical.jpg) expected="$expected_14065" ;;
              15133-underground-electrical.jpg) expected="$expected_15133" ;;
              16321-underground-electrical.jpg) expected="$expected_16321" ;;
              17385-underground-electrical.jpg) expected="$expected_17385" ;;
              212-underground-electrical.jpg) expected="$expected_212" ;;
              498-underground-electrical.jpg) expected="$expected_498" ;;
              601-underground-electrical.jpg) expected="$expected_601" ;;
              *)
                echo "Unexpected file: $base"
                exit 1
                ;;
            esac
            if [ "$actual" != "$expected" ]; then
              echo "SHA-256 mismatch for $dest"
              echo "expected $expected"
              echo "actual   $actual"
              exit 1
            fi
            echo "OK $dest $actual"
          done

          rm -rf _staging
          rm -f .github/workflows/decode-ug-photos.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "Decode staged underground photos into real JPEGs and remove staging files."
          git push origin HEAD:ug-photos-staging
